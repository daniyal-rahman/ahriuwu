[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ahriuwu"
version = "0.1.0"
description = "LoL autonomous agent using DreamerV4-style world model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.1.0",
    "opencv-python>=4.8.0",
    "easyocr>=1.7.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "ffmpeg-python>=0.2.0",
    "wandb>=0.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["legacy/src/ahriuwu"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
# All suites: lanerl_bot/ and lanerl_rl/ were NOT collected by a
# bare `pytest`, so both sat red without anyone noticing. lanerl_jax/ is on
# this list from its first test for the same reason -- an uncollected suite is
# a suite that rots silently.
testpaths = [
    "legacy/tests",
    "lanerl_rl/tests",
    "lanerl_train/tests",
    "lanerl_jax/parity/tests",
    "lanerl_jax/sim/tests",
    "lanerl_jax/obs/tests",
    "lanerl_jax/train/tests",
    "lanerl_jax/data/tests",
    "lanerl_jax/tests",
]
pythonpath = ["src"]
# `slow` was already used by lanerl_train/tests/test_state_hash_pairs.py while
# unregistered, so every run printed PytestUnknownMarkWarning and `-m "not slow"`
# silently selected nothing. Registered here so the deselect actually works.
markers = [
    "slow: boots a real game server; minutes, not milliseconds",
]
